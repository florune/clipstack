[package]
name = "clipstack"
version = "0.1.0"
edition = "2024"
description = "A fast, persistent clipboard history manager for Windows with global hotkeys and sequence macros"
license = "Apache-2.0"
repository = "https://github.com/florune/clipstack"
readme = "README.md"
keywords = ["clipboard", "clipboard-manager", "windows", "hotkey"]
categories = ["gui"]

[dependencies]
lz4_flex = "0.14.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
